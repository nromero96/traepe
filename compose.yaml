name: traepe

services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
    image: traepe/php-fpm:8.4.24-00b
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${TRAEPE_APP_KEY:?Set TRAEPE_APP_KEY in .env.docker}
      APP_TIMEZONE: UTC
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${TRAEPE_POSTGRES_DB:-traepe}
      DB_USERNAME: ${TRAEPE_POSTGRES_USER:-traepe}
      DB_PASSWORD: ${TRAEPE_POSTGRES_PASSWORD:?Set TRAEPE_POSTGRES_PASSWORD in .env.docker}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${TRAEPE_REDIS_PASSWORD:?Set TRAEPE_REDIS_PASSWORD in .env.docker}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: log
      FILESYSTEM_DISK: local
      MAIL_MAILER: log
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    volumes:
      - ./apps/api:/var/www/html
      - traepe_api_vendor:/var/www/html/vendor
      - traepe_composer_cache:/tmp/composer-cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 2>/dev/null | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - traepe_internal
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.28.0-alpine3.21@sha256:09ab424a8c788f8d0fe3a64429f6d19dfa526885c8609b748d0943a75dcb9f8c
    ports:
      - "127.0.0.1:${TRAEPE_HTTP_PORT:-8000}:80"
    volumes:
      - ./apps/api/public:/var/www/html/public:ro
      - ./infrastructure/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - traepe_internal
      - traepe_host
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgis/postgis:17-3.5-alpine@sha256:966243672c7d98cb996f26854a790b3b76e3cb77455d6eeb19d72ff82d20e7af
    environment:
      POSTGRES_DB: ${TRAEPE_POSTGRES_DB:-traepe}
      POSTGRES_USER: ${TRAEPE_POSTGRES_USER:-traepe}
      POSTGRES_PASSWORD: ${TRAEPE_POSTGRES_PASSWORD:?Set TRAEPE_POSTGRES_PASSWORD in .env.docker}
    ports:
      - "127.0.0.1:${TRAEPE_POSTGRES_PORT:-54320}:5432"
    volumes:
      - traepe_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - traepe_internal
      - traepe_host
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8.2.1-alpine3.22@sha256:f887e6dacdcfa8e14af2f625fdf4474ff8c37dc36ce13b9e89e6e9a901f155ad
    environment:
      REDIS_PASSWORD: ${TRAEPE_REDIS_PASSWORD:?Set TRAEPE_REDIS_PASSWORD in .env.docker}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${TRAEPE_REDIS_PORT:-63790}:6379"
    volumes:
      - traepe_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli -h 127.0.0.1 ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - traepe_internal
      - traepe_host
    security_opt:
      - no-new-privileges:true

networks:
  traepe_internal:
    name: traepe_internal
    driver: bridge
    internal: true
  traepe_host:
    name: traepe_host
    driver: bridge

volumes:
  traepe_postgres_data:
    name: traepe_postgres_data
  traepe_redis_data:
    name: traepe_redis_data
  traepe_api_vendor:
    name: traepe_api_vendor
  traepe_composer_cache:
    name: traepe_composer_cache
