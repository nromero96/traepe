log_format traepe_json escape=json '{"message":"nginx.request","datetime":"$time_iso8601","context":{"status_code":$status,"correlation_id":"$upstream_http_x_correlation_id","duration_seconds":$request_time}}';

server {
    access_log /var/log/nginx/access.log traepe_json;
    # Lower error levels can append raw URI, query, client IP and headers.
    # Sanitized access records retain HTTP failure visibility without request data.
    error_log /var/log/nginx/error.log emerg;
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream api:9000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass $api_upstream;
        fastcgi_read_timeout 60s;
    }

    location ~ /\. {
        deny all;
    }
}
