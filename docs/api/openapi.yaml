    "/api/v1/marketplace/local-coverage-probe": {
      "get": {
        "operationId": "localCoverageProbeV1",
        "summary": "Evaluar cobertura ficticia local",
        "description": "Solo local/testing, incluso con una caché de rutas local reutilizada. DP-027: polígonos sintéticos, bordes incluidos, máxima prioridad y empate ambiguo. No representa mercado, sucursal, precio ni ETA. Solo query; no refleja coordenadas. Límite técnico de 30 solicitudes/minuto.",
