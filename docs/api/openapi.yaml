    "/api/v1/marketplace/local-draft-commerces": {
      "post": {
        "operationId": "createLocalDraftCommerceV1",
        "summary": "Crear comercio y primera sucursal draft con datos ficticios en local/testing",
        "description": "DP-034: sesión cookie, CSRF y capacidad marketplace.local.draft_commerce.create con scope/recurso técnicos exactos. Mercado draft existente; nombres UTF-8 exactos sin controles, coordenadas numéricas WGS84 y timezone explícita Etc/UTC. Sin defaults de cliente, fiscalidad/riesgo o activación. Claim, merchant, branch e historial cifrado append-only en una transacción. Clave por actor/scope durante 24 horas sin extensión, purga o reuso; replay conserva snapshot y requiere create vigente. Números geográficos equivalentes y cero negativo comparten fingerprint; nombres no se normalizan. Errores 409: market_not_available, idempotency_mismatch, idempotency_expired. Límite independiente 30/minuto por actor; 404 fuera de local/testing antes de sesión o puertos.",
        "security": [
          {
            "LocalSessionCookie": []
          }
        ],
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "description": "ASCII imprimible sin espacios/control; no se normaliza ni almacena en claro.",
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 255,
              "pattern": "^[!-~]{1,255}(?![\\s\\S])"
            }
          },
          {
            "name": "X-XSRF-TOKEN",
            "in": "header",
            "required": true,
            "description": "Token CSRF obtenido de la cookie XSRF-TOKEN, decodificado por el cliente.",
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LocalDraftCommerceRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Operación creada o replay autorizado del snapshot original; correlación de solicitud actual.",
            "headers": {
              "X-Correlation-ID": {
                "schema": {
                  "type": "string",
                  "pattern": "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
                }
              },
              "Cache-Control": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
