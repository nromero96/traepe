        "summary": "Crear catálogo y primer producto conceptual draft del comercio propio en local/testing",
        "description": "DP-035/ADR-008: sesión cookie, CSRF y catalog.local.draft_catalog.create con scope/recurso técnicos exactos. Marketplace confirma y bloquea el comercio draft creado por el mismo actor mediante 02I. Claim, catálogo, producto y diario cifrado append-only en una transacción. Textos exactos UTF-8; descripción nullable permite LF, marca nullable; product_type exclusivamente NULL y no expuesto. Idempotencia 24 horas por actor/scope sin extensión, purga o reuso; replay requiere create vigente y devuelve el snapshot original sin reevaluar datos comerciales. 404 merchant_not_available uniforme para comercio ausente, ajeno o no elegible; 409 idempotency_mismatch/idempotency_expired. Límite propio 30/minuto por actor. 404 fuera de local/testing antes de sesión o puertos. Sin SKU, precios, stock, publicación ni administración real.",
