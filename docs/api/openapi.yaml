{
  "openapi": "3.0.3",
  "info": {
    "title": "trae.pe — API técnica",
    "version": "1.7.0",
    "description": "Platform, Identity cliente y Marketplace local/testing. Lectura de borradores, creación de perfiles sintéticos y alta/consulta de comercio draft requieren sesión cookie y capacidades técnicas independientes. Sin mercados reales."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8000",
      "description": "Docker local"
    }
  ],
  "paths": {
    "/api/v1/marketplace/local-draft-fixtures": {
      "post": {
        "operationId": "createLocalDraftFixtureV1",
        "summary": "Crear un perfil sintético fijo draft/fixture en local/testing",
        "description": "DP-031: capacidad marketplace.local.draft_fixture.create y scope/recurso técnicos resueltos por servidor. Cookie y CSRF obligatorios. Idempotencia por scope/actor/key durante 24 horas desde primer claim, sin extensión ni reuso al expirar. Replay autorizado: operación/snapshot original. Otro perfil válido: idempotency_mismatch. Expiración: idempotency_expired. País ZZ incompatible: fixture_country_conflict. Fuera de local/testing 404 antes de sesión, CSRF y consultas. Desarrollo sin permisos ni datos positivos; casos positivos solo en bases temporales propias.",
        "security": [
          {
            "LocalSessionCookie": []
          }
        ],
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "description": "ASCII imprimible sin espacios/control; no se normaliza ni almacena en claro.",
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 255,
              "pattern": "^[!-~]{1,255}$"
            }
          },
          {
            "name": "X-XSRF-TOKEN",
            "in": "header",
            "required": true,
            "description": "Token CSRF obtenido de la cookie XSRF-TOKEN, decodificado por el cliente.",
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LocalDraftFixtureRequest"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Operación creada o replay autorizado del snapshot original; correlación de solicitud actual.",
            "headers": {
              "X-Correlation-ID": {
                "schema": {
                  "type": "string",
                  "pattern": "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
                }
              },
              "Cache-Control": {
                "schema": {
                  "type": "string"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LocalDraftFixtureResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/ApiError"
          },
          "403": {
            "$ref": "#/components/responses/ApiError"
          },
          "404": {
            "$ref": "#/components/responses/ApiError"
          },
          "409": {
            "$ref": "#/components/responses/ApiError"
          },
          "415": {
            "$ref": "#/components/responses/ApiError"
          },
          "419": {
            "$ref": "#/components/responses/ApiError"
          },
          "422": {
            "$ref": "#/components/responses/ApiError"
          },
          "429": {
            "$ref": "#/components/responses/ApiError"
          },
          "500": {
            "$ref": "#/components/responses/ApiError"
          }
        }
      }
    },
    "/api/v1/health/ready": {
      "get": {
        "operationId": "readinessV1",
        "summary": "Estado de dependencias",
        "security": [],
        "responses": {
          "200": {
            "$ref": "#/components/responses/Readiness"
          },
