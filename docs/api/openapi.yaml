              "$ref": "#/components/schemas/CorrelationId"
            }
          }
        ]
      }
    },
    "/api/v1/technical/broadcasting/auth": {
      "post": {
        "operationId": "technicalBroadcastAuthV1",
        "summary": "Firma del único canal técnico privado local",
        "description": "DP-023: HTTP Basic exclusivo de desarrollo. La respuesta exitosa conserva el protocolo Pusher/Reverb, sin envelope. Fuera de local se deniega.",
        "security": [
          {
            "LocalTechnicalBasic": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "socket_id",
                  "channel_name"
                ],
                "properties": {
                  "socket_id": {
                    "type": "string",
                    "pattern": "^[0-9]+\\.[0-9]+$"
                  },
                  "channel_name": {
                    "type": "string",
                    "maxLength": 100,
                    "description": "Solo private-technical.v1 se autoriza."
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Firma Pusher/Reverb",
            "headers": {
              "X-Correlation-ID": {
                "$ref": "#/components/headers/CorrelationId"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "auth"
                  ],
                  "additionalProperties": false,
                  "properties": {
                    "auth": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/TechnicalDenied"
          },
          "403": {
            "$ref": "#/components/responses/ApiError"
          },
          "422": {
            "$ref": "#/components/responses/ApiError"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "500": {
            "$ref": "#/components/responses/ApiError"
          },
          "503": {
            "$ref": "#/components/responses/ApiError"
          }
        },
        "parameters": [
          {
            "name": "X-Correlation-ID",
            "in": "header",
            "required": false,
            "description": "ULID mayúsculo válido; cualquier otro formato se reemplaza sin reflejarlo.",
            "schema": {
              "$ref": "#/components/schemas/CorrelationId"
            }
          }
        ]
      }
    },
